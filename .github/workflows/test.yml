name: test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: PYTHONPATH=. pytest -v
      - name: Run main
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: PYTHONPATH=. python main.py
      - name: Salvar memoria
        run: |
          git config user.name "nexus-prime"
          git config user.email "nexus@nexus.com"
          git add memoria.json || true
          git commit -m "🧠 NEXUS aprendeu - atualizando memoria" || echo "sem novidades"
          git push || echo "nada pra enviar"
